name: Deploy buybap.com

# The site is built from live numbers in the BAP database (see tools/build_site.py), so it rebuilds
# every morning as well as on each push. If the numbers can't be fetched or a sanity check fails,
# the build fails and the live site keeps its previous version.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * *"   # 09:15 UTC, after the database refreshes its site stats at 08:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from live numbers
        run: python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
